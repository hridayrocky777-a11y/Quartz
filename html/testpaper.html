<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quartz — Files</title>
<link rel="stylesheet" href="../css/testpaper.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">Q</span>
    <span class="brand-name">QUARTZ</span>
  </div>
  <nav class="topnav">
    <a href="testpaper.html" class="active">test paper</a>
    <a href="chat.html">AI</a>
    <a href="home.html">Home</a>
    <a href="focus.html">Focus</a>
    <a href="backpack.html">Backpack</a>
  </nav>
  <div class="topbar-actions">
    <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
      <svg id="sunIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
    <div class="avatar"></div>
  </div>
</header>

<main class="page">
  <section class="hero">
    <h1>TEST yourself, <span class="accent">open</span> and TEST</h1>
    <p class="hero-sub">Tap any file below to open it to test you'r self.</p>
  </section>

  <section class="file-list" id="fileList" aria-label="File list"></section>
  <p class="empty" id="emptyMsg" hidden>No files yet — add entries in <code>files.js</code> below.</p>
</main>

<script>
  // ---- Add your files here ----
  // type: "image" | "pdf" | "video" | "audio" | "text" | "other"
  // Files open in a new tab so the browser handles them natively
  // (images render, PDFs open the built-in viewer, etc).
  const files = [
  {
    name: "Science Test Paper chapter 2 class 7th",
    urls: [
      "https://i.postimg.cc/4xmvhv9N/Screenshot-2026-08-26-170636.png",
      "https://i.postimg.cc/PrQCSCmD/Screenshot-2026-08-26-175743.png"
    ],
    type: "image"
  }
];

  const icons = {
    image: "🖼️",
    pdf: "📕",
    video: "🎬",
    audio: "🎵",
    text: "📄",
    other: "📦"
  };

  const listEl = document.getElementById("fileList");
  const emptyEl = document.getElementById("emptyMsg");

files.forEach(file => {
  const a = document.createElement("button");
  a.className = "file-item";
  a.type = "button";

  a.innerHTML = `
    <span class="file-icon">${icons[file.type] || icons.other}</span>
    <span class="file-info">
      <span class="file-name">${file.name}</span>
      <span class="file-type">${(file.type || "file").toUpperCase()}</span>
    </span>
    <span class="open-hint">Open ↗</span>
  `;

  a.addEventListener("click", () => {

    if (file.type === "image") {

      let currentPage = 0;

      const viewer = document.createElement("div");

      viewer.style.cssText = `
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: rgba(0,0,0,0.88);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
        box-sizing: border-box;
      `;

      viewer.innerHTML = `
        <button id="closeViewer"
          style="
            position:absolute;
            top:20px;
            right:25px;
            width:45px;
            height:45px;
            border:none;
            border-radius:50%;
            background:rgba(255,255,255,0.15);
            color:white;
            font-size:24px;
            cursor:pointer;
            z-index:10;
          ">
          ✕
        </button>

        <button id="prevPage"
          style="
            position:absolute;
            left:20px;
            top:50%;
            transform:translateY(-50%);
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            background:rgba(255,255,255,0.15);
            color:white;
            font-size:28px;
            cursor:pointer;
          ">
          ‹
        </button>

        <img id="paperImage"
          src="${file.urls[0]}"
          alt="${file.name}"
          style="
            max-width:85%;
            max-height:90%;
            object-fit:contain;
            border-radius:10px;
            box-shadow:0 10px 40px rgba(0,0,0,0.4);
          "
        >

        <button id="nextPage"
          style="
            position:absolute;
            right:20px;
            top:50%;
            transform:translateY(-50%);
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            background:rgba(255,255,255,0.15);
            color:white;
            font-size:28px;
            cursor:pointer;
          ">
          ›
        </button>

        <div id="pageCounter"
          style="
            position:absolute;
            bottom:20px;
            left:50%;
            transform:translateX(-50%);
            color:white;
            background:rgba(0,0,0,0.5);
            padding:8px 15px;
            border-radius:20px;
            font-size:14px;
          ">
          Page 1 / ${file.urls.length}
        </div>
      `;

      document.body.appendChild(viewer);

      const image = viewer.querySelector("#paperImage");
      const counter = viewer.querySelector("#pageCounter");
      const prev = viewer.querySelector("#prevPage");
      const next = viewer.querySelector("#nextPage");
      const close = viewer.querySelector("#closeViewer");

      function showPage() {
        image.src = file.urls[currentPage];

        counter.textContent =
          `Page ${currentPage + 1} / ${file.urls.length}`;

        prev.style.opacity =
          currentPage === 0 ? "0.3" : "1";

        next.style.opacity =
          currentPage === file.urls.length - 1 ? "0.3" : "1";
      }

      prev.addEventListener("click", (event) => {
        event.stopPropagation();

        if (currentPage > 0) {
          currentPage--;
          showPage();
        }
      });

      next.addEventListener("click", (event) => {
        event.stopPropagation();

        if (currentPage < file.urls.length - 1) {
          currentPage++;
          showPage();
        }
      });

      close.addEventListener("click", () => {
        viewer.remove();
      });

      showPage();

    } else {
      window.open(file.url, "_blank");
    }
  });

  listEl.appendChild(a);
});
  

  // Theme toggle logic
  const themeToggle = document.getElementById("themeToggle");
  const sunIcon = document.getElementById("sunIcon");

  themeToggle.addEventListener("click", () => {
    const currentTheme = document.documentElement.getAttribute("data-theme");
    const newTheme = currentTheme === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", newTheme);
    sunIcon.style.display = newTheme === "dark" ? "block" : "none";
  });
</script>

</body>
</html>
