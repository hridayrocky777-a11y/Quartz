
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Quartz.AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080b16;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(90%, 400px);
      padding: 35px;
      background: #12182a;
      border: 1px solid #283451;
      border-radius: 18px;
    }

    h1 { text-align: center; }
    p { text-align: center; color: #aab4ca; }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 9px;
      font-size: 15px;
    }

    input {
      background: #080e1e;
      border: 1px solid #35415d;
      color: white;
    }

    button {
      border: 0;
      background: #8065ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    a { color: #a997ff; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Quartz.AI</h1>
    <p>Create your account</p>

    <form id="signupForm">
      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password (minimum 8 characters)"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="signupButton">
        Create Account
      </button>
    </form>

    <p id="status" role="status"></p>

    <p>Already have an account?
      <a href="login.html">Login</a>
    </p>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://vehhcwpdlotwdmozgauj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_vnX5lJRzvVmt0M6GzaYREQ_yOxqXfOl";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("signupForm");
    const status = document.getElementById("status");
    const button = document.getElementById("signupButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      button.disabled = true;
      status.textContent = "Creating your account...";

      try {
        const { error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo:
              window.location.origin + "/Quartz/login.html"
          }
        });

        if (error) throw error;

        status.textContent =
          "Account created! Check your email and verify your account before logging in.";

        form.reset();

      } catch (error) {
        status.textContent =
          "Signup failed: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
